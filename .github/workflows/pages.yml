# .github/workflows/pages.yml

name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "manifest.json"
      - "src/shared/transform.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: 1) Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 2) Build Pages artifact
        shell: bash
        run: |
          mkdir -p _site/docs
          mkdir -p _site/src/shared

          cp -R docs/. _site/docs/
          cp manifest.json _site/manifest.json
          cp src/shared/transform.js _site/src/shared/transform.js

          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./docs/">
            <title>Minnesota Precinct Adapter</title>
          </head>
          <body>
            <p><a href="./docs/">Open the Minnesota Precinct Adapter Test</a></p>
          </body>
          </html>
          EOF

      - name: 3) Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: 4) Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: "_site"

      - name: 5) Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
